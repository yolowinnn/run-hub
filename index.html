<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f3d24" />
  <meta name="description" content="润 · Rùn — 把每天的学习，攒成出去的底气。英语、美国文化、Quant、技术，一个打卡，一套积分，一份出国准备度。" />
  <title>润 · Rùn — 学习打卡总览</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="side-brand" aria-hidden="true"><img src="assets/logo.png" alt="" /><b>润<span>·Rùn</span></b></div>
  <header id="topbar">
    <div class="tb-inner">
      <div class="tb-left">
        <img class="tb-logo" src="assets/logo.png" alt="润" />
        <div class="tb-name">润<span>·Rùn</span></div>
      </div>
      <div class="tb-right">
        <div class="pillstat" id="tb-beans" title="润豆">🫘 <b>0</b></div>
        <div class="pillstat flame" id="tb-streak" title="连续打卡">🔥 <b>0</b></div>
      </div>
    </div>
  </header>

  <main id="view"></main>

  <nav id="tabbar">
    <button class="tab active" data-tab="overview"><span class="ti">🏠</span><span class="tx">总览</span></button>
    <button class="tab" data-tab="verbal"><span class="ti">🗣️</span><span class="tx">语言</span></button>
    <button class="tab" data-tab="rewards"><span class="ti">🎁</span><span class="tx">奖励</span></button>
    <button class="tab" data-tab="me"><span class="ti">📈</span><span class="tx">我的</span></button>
  </nav>

  <div id="toast-host"></div>

  <script src="js/data.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/run-sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
